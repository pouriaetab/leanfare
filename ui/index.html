<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Leanfare makes the AI apps you already use cost less.">
<title>Leanfare</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<script src="/app.js" defer></script>
</head>
<body>
<div id="app" class="simple">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="lg-bg" width="32" height="32" rx="9"/><path class="lg-line" d="M8 10.5 L14 16.5 L18 13 L24 20.5"/><circle class="lg-dot" cx="24" cy="20.5" r="2.4"/></svg>
      <span>Leanfare</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Screens">
      <button role="tab" data-tab="chat" aria-selected="true">Chat</button>
      <button role="tab" data-tab="plan" aria-selected="false">Plan</button>
      <button role="tab" data-tab="savings" aria-selected="false">Savings</button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
    <div class="top-right">
      <div id="runningPill" class="pill running" hidden></div>
      <button id="spendPill" class="pill" title="What you spent this month. Opens Savings."></button>
      <button id="appsSwitch" class="hswitch" type="button" role="switch" aria-checked="true"><span class="hs-label">In your apps</span><span class="track" aria-hidden="true"><span class="knob"></span></span></button>
      <button id="pauseBtn" class="btn" title="Pause: new requests wait until you press Start again. Answers already running finish."></button>
    </div>
    <div id="themeSwitch" class="theme-switch" role="group" aria-label="Theme">
      <button type="button" data-mode="light" aria-pressed="false" aria-label="Day" title="Day"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.2v1.9M10 15.9v1.9M2.2 10h1.9M15.9 10h1.9M4.5 4.5l1.3 1.3M14.2 14.2l1.3 1.3M4.5 15.5l1.3-1.3M14.2 5.8l1.3-1.3"/></svg></button>
      <button type="button" data-mode="auto" aria-pressed="false" aria-label="Auto: day from 7 AM to 7 PM" title="Auto: day from 7 AM to 7 PM"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 5.6V10l3 1.9"/></svg></button>
      <button type="button" data-mode="dark" aria-pressed="false" aria-label="Night" title="Night"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.6 12.6A6.6 6.6 0 0 1 7.4 4.4a6.6 6.6 0 1 0 8.2 8.2z"/></svg></button>
    </div>
  </header>
  <div id="notices" aria-live="polite"></div>
  <main>
    <section id="tab-setup" class="tab simple" role="tabpanel" aria-label="Set up"></section>
    <section id="tab-chat" class="tab chat" role="tabpanel"></section>
    <section id="tab-plan" class="tab plan" role="tabpanel"></section>
    <section id="tab-savings" class="tab savings" role="tabpanel"></section>
    <section id="tab-settings" class="tab settings" role="tabpanel"></section>
  </main>
  <div id="toasts" aria-live="polite"></div>
</div>
</body>
</html>
