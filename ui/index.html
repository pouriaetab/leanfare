<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Every top AI model in one app on your own computer.">
<title>Leanfare</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="lg-bg" width="32" height="32" rx="9"/><path class="lg-line" d="M8 10.5 L14 16.5 L18 13 L24 20.5"/><circle class="lg-dot" cx="24" cy="20.5" r="2.4"/></svg>
      <span>Leanfare</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Screens">
      <button role="tab" data-tab="chat" aria-selected="true">Chat</button>
      <button role="tab" data-tab="plan" aria-selected="false">Plan</button>
      <button role="tab" data-tab="savings" aria-selected="false">Savings</button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
    <div class="top-right">
      <div id="runningPill" class="pill running" hidden></div>
      <button id="spendPill" class="pill" title="What you spent this month. Opens Savings."></button>
      <button id="pauseBtn" class="btn" title="Pause: new requests wait until you press Start again. Answers already running finish."></button>
    </div>
  </header>
  <div id="notices" aria-live="polite"></div>
  <main>
    <section id="tab-chat" class="tab chat on" role="tabpanel"></section>
    <section id="tab-plan" class="tab plan" role="tabpanel"></section>
    <section id="tab-savings" class="tab savings" role="tabpanel"></section>
    <section id="tab-settings" class="tab settings" role="tabpanel"></section>
  </main>
  <div id="toasts" aria-live="polite"></div>
</div>
</body>
</html>
