name: Feature request
description: An idea that would make Leanfare more useful.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Other tools that do it, pictures, links.
