name: release

# Builds Leanfare as one file for each kind of computer, checks that each build starts and serves
# its screens (Linux, Linux on Arm, macOS on Apple silicon and Intel, Windows), attaches the
# archives and their checksums to the release, and only then publishes it, so the installers
# never meet a release without its files. Since 0.12 also a one-click .mcpb bundle for each
# computer Claude Desktop runs on, and server.json for the official MCP Registry (scripts/mcpb.ts).
#
#   gh release create v0.4.0 --draft --target main --title "..." --notes-file release.md
#   gh workflow run release.yml -f tag=v0.4.0        (notes/ship.sh does both)
#
# A release published by hand still gets its files: the run on "published" attaches them.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to build, for example v0.4.0 (a draft is published once its files are attached)"
        required: true
  release:
    types: [published]

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: The version is the release's
        run: test "v$(jq -r .version package.json)" = "$TAG" || { echo "package.json says $(jq -r .version package.json), the release is $TAG"; exit 1; }
      - run: bun x tsc -p .
      - run: bun test
      - run: bun scripts/smoke.ts
      - run: bun scripts/licences.ts --offline

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun scripts/compile.ts --check
      - run: bun scripts/mcpb.ts
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  check-mac:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: The Apple silicon build starts and serves its page
        run: |
          mkdir m && tar -xzf dist/leanfare-darwin-arm64.tar.gz -C m
          codesign --verify m/leanfare && echo "Signed (ad hoc)."
          m/leanfare --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          LEANFARE_DATA_DIR="$PWD/data" LEANFARE_NO_OPEN=1 LEANFARE_KEYSTORE=file LEANFARE_PORT=4791 m/leanfare --no-open &
          for i in $(seq 1 100); do curl -fs http://127.0.0.1:4791/healthz >/dev/null && break; sleep 0.2; done
          curl -fs http://127.0.0.1:4791/ | grep -q "<title>Leanfare"
          kill %1
      - name: The one-click bundle holds the program, and its MCP door answers
        run: |
          mkdir b && unzip -q dist/leanfare-darwin-arm64.mcpb -d b
          test "$(jq -r .server.mcp_config.command b/manifest.json)" = '${__dirname}/server/leanfare'
          b/server/leanfare --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | LEANFARE_DATA_DIR="$PWD/data-mcpb" LEANFARE_NO_OPEN=1 LEANFARE_KEYSTORE=file LEANFARE_PORT=4792 b/server/leanfare mcp > door.jsonl
          grep -q '"name":"leanfare"' door.jsonl && grep -q '"name":"delegate"' door.jsonl
      - name: The Intel build starts (through Rosetta, where this runner has it)
        run: |
          mkdir i && tar -xzf dist/leanfare-darwin-x64.tar.gz -C i
          if arch -x86_64 /usr/bin/true 2>/dev/null; then arch -x86_64 i/leanfare --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          else echo "::warning::Rosetta is not on this runner, so the Intel build was not started."; fi

  check-linux-arm:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: The Arm build starts and serves its page
        run: |
          mkdir a && tar -xzf dist/leanfare-linux-arm64.tar.gz -C a
          a/leanfare --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          LEANFARE_DATA_DIR="$PWD/data" LEANFARE_NO_OPEN=1 LEANFARE_KEYSTORE=file LEANFARE_PORT=4791 a/leanfare --no-open &
          for i in $(seq 1 100); do curl -fs http://127.0.0.1:4791/healthz >/dev/null && break; sleep 0.2; done
          curl -fs http://127.0.0.1:4791/ | grep -q "<title>Leanfare"
          kill %1

  check-windows:
    needs: build
    runs-on: windows-latest
    continue-on-error: true # Windows builds are new: a failure here keeps only the Windows file off the release
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: The Windows build starts and serves its page
        id: check
        shell: pwsh
        run: |
          Expand-Archive dist/leanfare-windows-x64.zip -DestinationPath w
          $v = & .\w\leanfare.exe --version
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "--version said $v" }
          $env:LEANFARE_DATA_DIR = "$PWD\data"; $env:LEANFARE_NO_OPEN = "1"; $env:LEANFARE_KEYSTORE = "file"; $env:LEANFARE_PORT = "4791"
          $p = Start-Process -FilePath .\w\leanfare.exe -ArgumentList "--no-open" -PassThru
          $up = $false
          for ($i = 0; $i -lt 100 -and -not $up; $i++) { try { $up = (Invoke-WebRequest http://127.0.0.1:4791/healthz -UseBasicParsing).StatusCode -eq 200 } catch { Start-Sleep -Milliseconds 200 } }
          if (-not $up) { throw "it did not start" }
          if ((Invoke-WebRequest http://127.0.0.1:4791/ -UseBasicParsing).Content -notmatch "<title>Leanfare") { throw "no page" }
          Stop-Process -Id $p.Id
          "ok=true" >> $env:GITHUB_OUTPUT

  publish:
    needs: [build, check-mac, check-linux-arm, check-windows]
    if: ${{ always() && needs.build.result == 'success' && needs.check-mac.result == 'success' && needs.check-linux-arm.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job writes: the files, then the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Attach the files, then publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_OK: ${{ needs.check-windows.outputs.ok }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "There is no release $TAG yet: make it (a draft is fine), then run this again."; exit 1; }
          files="dist/leanfare-darwin-arm64.tar.gz dist/leanfare-darwin-x64.tar.gz dist/leanfare-linux-x64.tar.gz dist/leanfare-linux-arm64.tar.gz dist/leanfare-darwin-arm64.mcpb dist/leanfare-darwin-x64.mcpb"
          if [ "$WINDOWS_OK" = true ]; then files="$files dist/leanfare-windows-x64.zip dist/leanfare-windows-x64.mcpb"
          else
            echo "::warning::The Windows check failed: its files stay off this release."
            grep -v "leanfare-windows-x64" dist/SHA256SUMS > dist/SHA256SUMS.tmp && mv dist/SHA256SUMS.tmp dist/SHA256SUMS
            jq '.packages |= map(select(.identifier | contains("windows") | not))' dist/server.json > dist/server.json.tmp && mv dist/server.json.tmp dist/server.json
          fi
          gh release upload "$TAG" $files dist/SHA256SUMS dist/server.json --clobber --repo "$GITHUB_REPOSITORY"
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --target "$GITHUB_SHA"
            echo "Published $TAG at $GITHUB_SHA, with its files."
          fi
