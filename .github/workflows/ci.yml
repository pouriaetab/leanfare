name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun x tsc -p .
      - run: bun test
      - run: bun scripts/smoke.ts
      - run: bun scripts/compile.ts linux-x64 --check
      - run: bun scripts/licences.ts --offline

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: bash mac/build.sh
      - run: test -x mac/build/Leanfare.app/Contents/MacOS/Leanfare
